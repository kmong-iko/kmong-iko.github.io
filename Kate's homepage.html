<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kate Ong-iko — UI/UX Designer, illustrator, and developer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFCA5; --ink:#000; --accent:#FF8800; --nav:#A33100; --muted:#A33100;
  --bubble-bg:#FFF8DC; --bubble-ink:#4A1A08; --bubble-line:#7A2A12;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#3B3868; --ink:#FFF3C4; --accent:#FFA630; --nav:#FFC98A; --muted:#E6C9A0;
    --bubble-bg:#FFF8DC; --bubble-ink:#4A1A08; --bubble-line:#2A0000; color-scheme:dark;
  }
  :root:not([data-theme="light"]) .moon{display:block}
  :root:not([data-theme="light"]) .sun{display:none}
}
:root[data-theme="dark"]{
  --bg:#3B3868; --ink:#FFF3C4; --accent:#FFA630; --nav:#FFC98A; --muted:#E6C9A0;
  --bubble-bg:#FFF8DC; --bubble-ink:#4A1A08; --bubble-line:#2A0000; color-scheme:dark;
}
:root[data-theme="dark"] .moon{display:block}
:root[data-theme="dark"] .sun{display:none}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;display:grid;grid-template-rows:auto 1fr auto;background:var(--bg);color:var(--ink);
  font:400 1rem/1.4 "Work Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;transition:background .3s,color .3s;overflow-x:hidden}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--accent);outline-offset:4px;border-radius:6px}

header{position:relative;display:flex;justify-content:center;padding:1.5rem 4.5rem 0}
nav{display:flex;gap:clamp(1.25rem,3.4vw,2.6rem)}
nav a{color:var(--nav);font-weight:500;padding:.25rem .1rem;border-bottom:2px solid transparent;transition:border-color .2s}
nav a:hover{border-color:currentColor}
#theme{position:absolute;right:clamp(1rem,3vw,2.2rem);top:1.2rem;width:2.5rem;height:2.5rem;display:grid;place-items:center;
  border:0;background:none;color:var(--accent);cursor:pointer;border-radius:50%}
#theme svg{width:1.9rem;height:1.9rem;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
#theme .moon{display:none}
#theme:hover svg{transform:rotate(18deg)}
#theme svg{transition:transform .25s}

main{position:relative;display:flex;flex-direction:column;justify-content:space-between;min-height:0}
.hero{padding:2rem clamp(1.5rem,6vw,5rem) 0;position:relative;z-index:2}
h1{margin:0;font-weight:400;font-size:clamp(2.5rem,5.4vw,4.5rem);line-height:1.1;letter-spacing:-.01em}
h1 span{color:var(--accent)}
.hero p{margin:.7rem 0 0;font-size:clamp(1rem,1.5vw,1.25rem)}

.stage{align-self:center;width:min(94vw,calc((100svh - 25rem)*1.198),560px);margin-top:1rem}
.scene{position:relative;width:100%;aspect-ratio:1919/1602;container-type:inline-size;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.l{position:absolute;display:block;pointer-events:none;height:auto}
.body-idle{opacity:0;transition:opacity .14s linear}
.scene[data-pose="idle"] .body-idle{opacity:1}
#pupils{will-change:transform}
.mouth-open{opacity:0}
.scene.talking .mouth-open{opacity:1}
.scene.talking .mouth-closed{opacity:0}

#head{position:absolute;left:42.6%;top:19.3%;width:47.3%;height:49.3%;border:0;padding:0;background:none;border-radius:48%;cursor:pointer;z-index:5}

#bubble{position:absolute;left:3%;top:8%;width:38%;min-width:8.5rem;z-index:6;padding:.7em .9em;
  background:var(--bubble-bg);color:var(--bubble-ink);border:.2em solid var(--bubble-line);border-radius:1.1em;
  font-size:max(.8rem,2.7cqw);font-weight:500;line-height:1.3;pointer-events:none;
  opacity:0;transform:scale(.85) translateY(.4em);transform-origin:100% 100%;transition:opacity .18s,transform .22s cubic-bezier(.3,1.5,.5,1)}
#bubble.show{opacity:1;transform:none}
#bubble::after{content:"";position:absolute;right:-.62em;bottom:1.1em;width:.9em;height:.9em;background:var(--bubble-bg);
  border:solid var(--bubble-line);border-width:.2em .2em 0 0;transform:rotate(45deg) skew(8deg,8deg);border-radius:0 .2em 0 0}

footer{display:flex;flex-direction:column;align-items:center;gap:.4rem;padding:1rem 1rem 1.1rem}
.social{display:flex;gap:1.1rem}
.social a{color:var(--accent);display:grid;place-items:center;width:2rem;height:2rem;transition:transform .2s}
.social a:hover{transform:translateY(-3px)}
.social svg{width:1.7rem;height:1.7rem;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
footer small{font-size:.72rem;color:var(--muted)}

@media (min-width:761px){
  main{display:block}
  .hero{position:absolute;left:0;top:50%;transform:translateY(-52%);padding:0 0 0 clamp(2rem,6.4vw,5.5rem)}
  .stage{position:absolute;right:clamp(.5rem,3.5vw,3rem);bottom:0;margin:0;align-self:auto;
    width:min(50vw,calc((100svh - 8.5rem)*1.198),1000px)}
}
@media (max-width:760px){
  header{padding-inline:3.5rem}
  .hero{text-align:center}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<header>

    <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>
  </button>
</header>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const root = document.documentElement, scene = $('#scene'), pupils = $('#pupils');
  const bubble = $('#bubble'), bubbleText = $('#bubbleText');

  /* ---- Tunables (units = original artwork pixels) ---- */
  const W = 1919;
  const EYE_CENTER = [(1163 - 20) / W, (795 - 16) / 1602]; // between the eyes, as a fraction of the scene
  const MAX_MOVE = [26, 18];      // max pupil travel (x, y); the pupil-cover layer clips any overshoot
  const IDLE_MS = 1500;           // inactivity before the character stops typing
  const SMOOTH = 0.16;            // eye easing (0–1, higher = snappier)
  const WELCOME = 'Hi, I’m Kate! Welcome to my little corner of the web.';
  const MESSAGES = [
    'Psst… my workfolio is worth a peek.',
    'Coffee first, pixels second.',
    'I draw things, then I make them clickable.',
    'Thanks for stopping by!',
    'Need a designer who codes? Hi.',
    'Shh, I’m mid-commit.'
  ];

  const coarse = matchMedia('(pointer: coarse)').matches;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const restGaze = () => [-0.55 * MAX_MOVE[0], 0.5 * MAX_MOVE[1]]; // glance toward the laptop

  /* ---- Eye tracking ---- */
  let rect, scale, cur = restGaze(), tgt = cur.slice(), raf = 0;
  const measure = () => { rect = scene.getBoundingClientRect(); scale = rect.width / W; draw(); };
  const draw = () => { pupils.style.transform = `translate3d(${cur[0] * scale}px,${cur[1] * scale}px,0)`; };
  const tick = () => {
    const k = reduce ? 1 : SMOOTH;
    cur[0] += (tgt[0] - cur[0]) * k; cur[1] += (tgt[1] - cur[1]) * k;
    draw();
    raf = (Math.abs(tgt[0] - cur[0]) + Math.abs(tgt[1] - cur[1]) > 0.03) ? requestAnimationFrame(tick) : 0;
  };
  const go = () => { if (!raf) raf = requestAnimationFrame(tick); };
  const look = (x, y) => {
    const dx = x - (rect.left + EYE_CENTER[0] * rect.width), dy = y - (rect.top + EYE_CENTER[1] * rect.height);
    const d = Math.hypot(dx, dy) || 1, f = Math.min(1, d / (rect.width * 0.45));
    tgt = [dx / d * f * MAX_MOVE[0], dy / d * f * MAX_MOVE[1]];
    go();
  };

  /* ---- Typing / idle ---- */
  let idleT;
  const wake = () => {
    scene.dataset.pose = 'typing';
    clearTimeout(idleT);
    idleT = setTimeout(() => {
      scene.dataset.pose = 'idle';
      if (coarse) { tgt = restGaze(); go(); }
    }, IDLE_MS);
  };
  addEventListener('pointermove', e => { look(e.clientX, e.clientY); wake(); }, { passive: true });
  addEventListener('pointerdown', e => { look(e.clientX, e.clientY); wake(); }, { passive: true });
  document.addEventListener('mouseleave', () => { if (!coarse) { tgt = restGaze(); go(); } });
  if (coarse) setInterval(() => { if (!document.hidden) wake(); }, 6000); // touch devices: type in short bursts

  /* ---- Avatar click ---- */
  let first = true, last = -1, hideT;
  $('#head').addEventListener('click', () => {
    let msg = WELCOME;
    if (first) first = false;
    else { let i; do { i = Math.floor(Math.random() * MESSAGES.length); } while (i === last); last = i; msg = MESSAGES[i]; }
    bubbleText.textContent = msg;
    scene.classList.add('talking'); bubble.classList.add('show');
    clearTimeout(hideT);
    hideT = setTimeout(() => { scene.classList.remove('talking'); bubble.classList.remove('show'); }, 2200 + msg.length * 40);
  });

  /* ---- Theme ---- */
  let saved = null; try { saved = localStorage.getItem('theme'); } catch (e) {}
  if (saved) root.dataset.theme = saved;
  $('#theme').addEventListener('click', () => {
    const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    const next = dark ? 'light' : 'dark';
    root.dataset.theme = next;
    try { localStorage.setItem('theme', next); } catch (e) {}
  });

  new ResizeObserver(measure).observe(scene);
  addEventListener('scroll', measure, { passive: true });
  measure(); wake();
})();
</script>
